<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Dhritimaan & Tushali — Wedding Manager</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#ffffff;--card:#f7f6f3;--ink:#222222;--gold:#a98532;--sage:#3f7f55;--red:#b3402f;--line:#e7e4dc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Georgia,serif}
main{max-width:980px;margin:auto;padding:16px}h1{font-weight:400;margin:0}h1 small{display:block;font-size:13px;color:var(--gold);letter-spacing:.08em}
nav{display:flex;gap:6px;margin:14px 0;flex-wrap:wrap}button,input,select{font:inherit;color:inherit}
button{background:var(--card);border:1px solid var(--gold);border-radius:20px;padding:10px 16px;cursor:pointer;min-height:44px}
button.on,button.p{background:var(--gold);color:#fff}.card{background:var(--card);border-radius:14px;padding:14px;margin:10px 0;box-shadow:0 2px 8px #0001;animation:f .3s}
@keyframes f{from{opacity:0;transform:translateY(6px)}}@media(prefers-reduced-motion:reduce){.card{animation:none}}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.n{font-size:22px}.l{font-size:12px;opacity:.7}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--sage)}
.t{font-size:12px;padding:2px 8px;border-radius:10px;border:1px solid currentColor}.ok{color:var(--sage)}.bad{color:var(--red)}.w{color:var(--gold)}
input,select{padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);width:100%;margin:4px 0}
.r{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}td,th{padding:6px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.note{font-size:13px;border-left:3px solid var(--gold);padding-left:10px}.card{border:1px solid var(--line)}.pay .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.acts{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}.acts a{color:var(--gold);border:1px solid var(--gold);border-radius:20px;padding:8px 14px;text-decoration:none;min-height:40px}
#hero{position:fixed;inset:0;z-index:50;background:radial-gradient(circle at 50% 40%,#fff 0%,#faf6ec 60%,#f1e6c8 100%);color:#222;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;overflow:hidden;transition:opacity .8s,transform .8s}#hero.out{opacity:0;transform:scale(1.15);pointer-events:none}#hero .ring{position:absolute;width:min(80vw,520px);aspect-ratio:1;border:2px dashed var(--gold);border-radius:50%;opacity:.35;animation:spin 30s linear infinite}#hero .r2{width:min(58vw,380px);border-style:solid;opacity:.25;animation-direction:reverse;animation-duration:20s}#hero h2{position:relative;font-weight:400;font-size:clamp(38px,9vw,84px);margin:0;letter-spacing:.04em}#hero .nm{display:inline-block;animation:rise 1s cubic-bezier(.2,1.4,.4,1) both}#hero .amp{display:block;color:var(--gold);font-style:italic;font-size:.6em;animation:pop 1s .5s both}#hero p{position:relative;letter-spacing:.2em;font-size:13px;color:var(--gold);animation:rise 1s 1s both}#hero button{position:relative;margin-top:28px;font-size:18px;padding:14px 40px;animation:rise 1s 1.3s both,pulse 2.4s 2.4s infinite}.petal{position:absolute;top:-30px;width:12px;height:16px;background:var(--gold);opacity:.5;border-radius:80% 0 80% 0;animation:fall linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes rise{from{opacity:0;transform:translateY(40px) scale(.8)}}@keyframes pop{from{opacity:0;transform:scale(0) rotate(-90deg)}}@keyframes pulse{50%{box-shadow:0 0 0 14px #a9853230}}@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@keyframes fly{from{opacity:0;transform:translateX(-140px) rotate(-10deg) scale(.6)}}@keyframes flyr{from{opacity:0;transform:translateX(140px) rotate(10deg) scale(.6)}}@keyframes flip{from{opacity:0;transform:perspective(700px) rotateX(-95deg) translateY(40px)}}@keyframes zoom{from{opacity:0;transform:scale(.1) rotate(-200deg)}}@keyframes drop{from{opacity:0;transform:translateY(-170px) scaleY(1.6)}}@keyframes skewin{from{opacity:0;transform:translateX(-200px) skewX(35deg)}}@keyframes blurin{from{opacity:0;filter:blur(18px);transform:scale(1.4) translateY(30px)}}
#v.a0 .card,#v.a0 h3,#v.a1 .card,#v.a1 h3,#v.a2 .card,#v.a2 h3,#v.a3 .card,#v.a3 h3,#v.a4 .card,#v.a4 h3,#v.a5 .card,#v.a5 h3{animation-duration:.8s;animation-timing-function:cubic-bezier(.2,1.3,.4,1);animation-delay:calc(var(--i,0)*70ms);animation-fill-mode:both}
#v.a0 .card,#v.a0 h3{animation-name:fly}#v.a0 .card:nth-child(even){animation-name:flyr}#v.a1 .card,#v.a1 h3{animation-name:flip}#v.a2 .card,#v.a2 h3{animation-name:zoom}#v.a3 .card,#v.a3 h3{animation-name:skewin}#v.a4 .card,#v.a4 h3{animation-name:drop}#v.a5 .card,#v.a5 h3{animation-name:blurin}
button{transition:transform .2s}button:hover{transform:translateY(-2px) scale(1.04)}
@media(prefers-reduced-motion:reduce){#v .card,#v h3,#hero *{animation:none!important}#hero{transition:none}.petal{display:none}button:hover{transform:none}}
#sp{position:fixed;top:0;left:0;height:3px;width:100%;background:var(--gold);transform-origin:0 50%;transform:scaleX(0);z-index:40}#v .sr{opacity:0;transform:translateX(var(--sx,0)) translateY(50px) scale(.92);transition:opacity .7s ease,transform .8s cubic-bezier(.2,1.2,.4,1);animation:none!important}#v tr.sr{transform:translateX(var(--sx,0))}#v .sr.in{opacity:1;transform:none}
nav button{transition:box-shadow .3s,background .3s,transform .2s}button:active{transform:scale(.95)}nav button.on{box-shadow:0 0 0 3px #a9853233,0 0 22px 4px #a9853288;animation:glow 2s ease-in-out infinite}nav button.on.lit{animation:flash .9s,glow 2s .9s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 5px #a9853222,0 0 32px 8px #a98532aa}}@keyframes flash{0%{box-shadow:0 0 0 0 #a98532}30%{transform:scale(1.14);box-shadow:0 0 0 14px #a9853255,0 0 44px 14px #a98532}100%{transform:scale(1)}}@keyframes sweep{from{background-position:100% 0;opacity:1}to{background-position:0 0;opacity:0}}
#v{position:relative}#v.lit::before{content:"";position:absolute;inset:-10px;pointer-events:none;border-radius:16px;background:linear-gradient(100deg,transparent 30%,#a9853255 50%,transparent 70%);background-size:300% 100%;animation:sweep 1s ease-out both}#v .card:not(.sr){transition:border-color 1.2s,box-shadow 1.2s}#v.lit .card:not(.sr){border-color:var(--gold);box-shadow:0 0 22px #a9853266}
@media(prefers-reduced-motion:reduce){nav button.on,nav button.on.lit{animation:none}#v.lit::before{display:none}}
.note{position:absolute;top:-80px;z-index:1;height:30px;border-radius:4px;border:1.5px solid #4a5a4f;color:#2d3a31;font:700 14px/27px Georgia,serif;text-align:center;box-shadow:0 2px 6px #0003;animation:nfall linear infinite}.note::before{content:"";position:absolute;inset:3px;border:1px dashed #4a5a4f66;border-radius:3px}#hero h2,#hero button{z-index:2}
@keyframes nfall{0%{transform:translate(0,0) rotate(var(--r,0deg)) rotateY(0)}50%{transform:translate(var(--sw,30px),55vh) rotate(calc(var(--r,0deg) + 120deg)) rotateY(180deg)}100%{transform:translate(0,115vh) rotate(calc(var(--r,0deg) + 260deg)) rotateY(360deg)}}
@media(prefers-reduced-motion:reduce){.note{display:none}}
#pr{display:none}@media print{#hero,#sp,main>h1{display:none!important}#pr{font:13px/1.45 Georgia,serif;color:#222}#pr *{-webkit-print-color-adjust:exact;print-color-adjust:exact}#pr .hd{background:linear-gradient(100deg,#8f6d1f,#d4b05c);color:#fff;padding:16px 20px;border-radius:10px;margin-bottom:14px}#pr .hd h1{margin:0;font-size:24px;font-weight:400;letter-spacing:.02em}#pr .hd div{font-size:12px}#pr .kp{display:flex;gap:10px;margin-bottom:10px}#pr .kc{flex:1;border-radius:10px;padding:10px 12px;border:1px solid #ddd;border-top-width:5px}#pr .kc b{display:block;font-size:19px}#pr .kc span,#pr .fg span{font-size:10px;color:#555;text-transform:uppercase;letter-spacing:.06em}#pr .k1{background:#fbf5e4;border-top-color:#a98532}#pr .k2{background:#e8f4ec;border-top-color:#3f7f55}#pr .k3{background:#fbe9e6;border-top-color:#b3402f}#pr .k4{background:#f1f1ef;border-top-color:#777}#pr .pb{height:10px;background:#f3d4cf;border-radius:5px;overflow:hidden;margin:6px 0 2px}#pr .pb i{display:block;height:100%;background:#3f7f55}#pr .lg{font-size:11px;color:#555;margin:6px 0 4px}#pr h2{font-size:16px;font-weight:400;margin:16px 0 6px;padding-left:8px;border-left:5px solid #a98532;break-after:avoid;page-break-after:avoid}#pr .rt{width:100%;border-collapse:collapse;font-size:12px}#pr .rt th{background:#33302a;color:#fff;padding:6px;text-align:left;border:0}#pr .rt td{padding:6px;border:0;border-bottom:1px solid #e5e1d6;vertical-align:top}#pr .rt tbody tr:nth-child(even) td{background:#faf8f2}#pr .ch{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;color:#fff;white-space:nowrap}#pr .s-ok{background:#3f7f55}#pr .s-w{background:#c98a1b}#pr .s-bad{background:#b3402f}#pr .vc{border:1px solid #ddd;border-left:6px solid #a98532;border-radius:10px;padding:10px 12px;margin:0 0 16px;break-inside:avoid;page-break-inside:avoid}#pr .vc h3{margin:0 0 4px;font-size:16px;font-weight:400}#pr .fg{display:flex;gap:8px;margin:8px 0}#pr .fg div{flex:1;border-radius:8px;padding:6px 8px;background:#f7f6f3}#pr .fg b{display:block;font-size:15px}nav,button,form,.np,#v{display:none!important}#pr{display:block}body{background:#fff;color:#000;-webkit-print-color-adjust:exact;print-color-adjust:exact}main{padding:0}.vs{break-inside:avoid;page-break-inside:avoid;margin:0 0 20px}.vs h3{margin:0 0 4px;break-after:avoid;page-break-after:avoid}#pr table{width:100%;border-collapse:collapse;font-size:12px}#pr td,#pr th{border:1px solid #bbb;padding:5px;white-space:normal}#pr thead{display:table-header-group}#pr tr{break-inside:avoid;page-break-inside:avoid}@page{margin:14mm}}
</style></head><body><div id="sp"></div><div id="hero"><div class="ring"></div><div class="ring r2"></div><h2><span class="nm">Expense</span> <span class="nm" style="animation-delay:.3s">Tracker</span></h2><button class="p" onclick="enter()">Enter</button></div><main>
<h1>Dhritimaan & Tushali — Wedding Manager<small>WEDDING EXPENSES, PAYMENTS & VENDOR MANAGEMENT</small></h1>
<nav id="nav"></nav><div id="v"></div><div id="pr"></div>
<p class="note np">Records are saved in this browser only and are not shared across devices.</p></main>
<script>
const K='wm_v1',P=['Advance','Partial Payment','Final Payment','Refund','Reversal','Adjustment'],M=['UPI','NEFT','RTGS','IMPS','Bank Transfer','Credit Card','Debit Card','Cheque','Cash','Other'],S=['Pending','Successful','Failed','Cancelled','Reversed'];
const seed=()=>({vendors:['Welina Hotels, Bhubaneswar','Transitel Hotel, Kolkata','Car Booking','Catering, Bhubaneswar'].map((n,i)=>({id:'v'+i,name:n,bill:null,due:'',start:'',end:''})),pays:[],log:[]});
let D;try{D=JSON.parse(localStorage.getItem(K))||seed()}catch(e){D=seed()}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}};
const inr=n=>'₹'+Number(n).toLocaleString('en-IN');const $=s=>document.getElementById(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function calc(v){const ps=D.pays.filter(p=>p.vid===v.id&&p.status==='Successful');
 const sign=p=>(p.type==='Refund'||p.type==='Reversal')?-1:1;
 const net=ps.reduce((a,p)=>a+sign(p)*p.amt,0),adv=ps.filter(p=>p.type==='Advance').reduce((a,p)=>a+p.amt,0);
 let st,out=null,over=0;
 if(v.bill==null){st='Bill Pending'}else{out=v.bill-net;if(out<0){over=-out;st='Overpaid'}else if(out===0&&v.bill>0)st='Fully Paid';else st=net>0?'Partially Paid':'Unpaid'}
 const pend=D.pays.some(p=>p.vid===v.id&&p.status==='Pending'),noProof=ps.some(p=>!p.proof),noConf=!v.conf;
 return{net,adv,out,over,st,pend,noProof,noConf}}
let view='Dashboard',cur=null;
function nav(){$('nav').innerHTML=['Dashboard','Vendors','Record Payment','Ledger','Calendar','Audit'].map(x=>`<button class="${x==view?'on':''}" onclick="go('${x}')">${x}</button>`).join('')+`<button onclick="buildPr();window.print()">Export PDF</button>`}
function go(x){view=x;nav();render();anim()}
function render(){D.vendors.forEach(()=>0);let h='';
 if(view=='Dashboard'){const c=D.vendors.map(calc),known=D.vendors.filter(v=>v.bill!=null),
  bills=known.reduce((a,v)=>a+v.bill,0),paid=c.reduce((a,x)=>a+x.net,0),out=c.reduce((a,x)=>a+(x.out>0?x.out:0),0);
  const cnt=s=>c.filter(x=>x.st==s).length;
  h=`<div class="g">${[['Confirmed bills',inr(bills)],['Net paid',inr(paid)],['Outstanding',inr(out)],['Vendors',D.vendors.length],['Fully paid',cnt('Fully Paid')],['Partially paid',cnt('Partially Paid')],['Unpaid',cnt('Unpaid')],['Awaiting final bill',cnt('Bill Pending')],['Missing proof',c.filter(x=>x.noProof).length],['Missing vendor confirmation',c.filter(x=>x.noConf).length]].map(([a,b])=>`<div class="card"><div class="l">${a}</div><div class="n">${b}</div></div>`).join('')}</div>${charts(c,bills,paid,out)}<h3>Vendors</h3>`+D.vendors.map(vcard).join('')}
 if(view=='Vendors'){h=D.vendors.map(vcard).join('')+`<form class="card" onsubmit="addV(event)"><b>Add vendor</b><input id="nv" placeholder="Vendor name" required><button class="p">+ Add Vendor</button></form>`}
 if(view=='Vendor'){const v=D.vendors.find(x=>x.id==cur),c=calc(v);h=`<button onclick="go('Vendors')">← Back</button><div class="card"><h2>${esc(v.name)}</h2><span class="t ${tc(c.st)}">${c.st}</span>
 <p>Bill: ${v.bill==null?'not entered':inr(v.bill)} · Advance: ${inr(c.adv)} · Net paid: ${inr(c.net)} · ${c.over?'Excess: '+inr(c.over):c.out==null?'Outstanding: —':'Outstanding: '+inr(c.out)}</p>
 <form onsubmit="setBill(event,'${v.id}')"><label class="l">Confirmed bill amount (₹) — blank means unknown, not ₹0</label><input id="bl" type="number" min="0" step="0.01" value="${v.bill??''}"><label class="l">Payment due</label><input id="du" type="date" value="${v.due}"><label class="l">Service start</label><input id="ss" type="date" value="${v.start}"><label class="l">Service end</label><input id="se" type="date" value="${v.end}"><button class="p">Save</button></form></div><h3>Statement</h3>${table(D.pays.filter(p=>p.vid==v.id))}`}
 if(view=='Record Payment'){h=`<form class="card" onsubmit="addP(event)"><select id="pv">${D.vendors.map(v=>`<option value="${v.id}">${esc(v.name)}</option>`).join('')}</select>
 <input id="pa" type="number" min="0.01" step="0.01" placeholder="Amount ₹" required><label class="l">Payment date (from receipt; never guessed)</label><input id="pd" type="date" required>
 <select id="pt">${P.map(x=>`<option>${x}</option>`)}</select><select id="pm">${M.map(x=>`<option>${x}</option>`)}</select><select id="ps">${S.map(x=>`<option ${x=='Successful'?'selected':''}>${x}</option>`)}</select>
 <input id="pu" placeholder="Transaction ID / UTR"><input id="pn" placeholder="Notes">
 <label class="l">Payment proof (PDF, JPG or PNG, up to 10 MB)</label><input id="pf" type="file" accept=".pdf,.jpg,.jpeg,.png,image/*,application/pdf" multiple><label class="l">Vendor confirmation (PDF, JPG or PNG, up to 10 MB)</label><input id="cf" type="file" accept=".pdf,.jpg,.jpeg,.png,image/*,application/pdf" multiple><label><input type="checkbox" id="pp" style="width:auto"> Payment proof held (without a file)</label><br><label><input type="checkbox" id="pc" style="width:auto"> Vendor confirmation held (without a file)</label><br><button class="p">Save payment</button><p id="msg" class="bad"></p></form>`}
 if(view=='Ledger'){h=`<button onclick="csv()">Export CSV</button><div class="card r">${table(D.pays,1)}</div>`}
 if(view=='Record Payment')h=payForm();
 if(view=='Vendor')h=vendorView();
 if(view=='Calendar')h=cal();
 if(view=='Audit')h=audit();
 $('v').innerHTML=h}
const tc=s=>s=='Fully Paid'?'ok':s=='Overpaid'||s=='Unpaid'?'bad':'w';
function vcard(v){const c=calc(v),pct=v.bill>0?Math.max(0,Math.min(100,c.net/v.bill*100)):0;
 return`<div class="card" onclick="cur='${v.id}';go('Vendor')" style="cursor:pointer"><b>${esc(v.name)}</b> <span class="t ${tc(c.st)}">${c.st}</span><div class="bar"><i style="width:${pct}%"></i></div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px"><div><div class="l">Total bill</div><b>${v.bill==null?'Bill pending':inr(v.bill)}</b></div><div><div class="l">Amount paid</div><b class="ok">${inr(c.net)}</b></div><div><div class="l">Amount due</div><b class="${c.out>0?'bad':''}">${v.bill==null?'—':inr(Math.max(c.out,0))}</b></div></div><div class="l" style="margin-top:6px">${[c.over?'Excess paid '+inr(c.over):'',c.noProof?'proof missing':'',c.noConf?'confirmation missing':''].filter(Boolean).join(' · ')}</div></div>`}
function table(a,all){if(!a.length)return'<p class="l">No transactions yet.</p>';
 return`<div class="r"><table><tr><th>Ref</th><th>Date</th>${all?'<th>Vendor</th>':''}<th>Type</th><th>Amount</th><th>Status</th><th>UTR</th><th>Proof</th><th>Conf.</th><th>Files</th><th></th></tr>${[...a].sort((x,y)=>x.date<y.date?1:-1).map(p=>`<tr><td>${p.ref}</td><td>${p.date}</td>${all?`<td>${esc(D.vendors.find(v=>v.id==p.vid)?.name)}</td>`:''}<td>${p.type}</td><td>${inr(p.amt)}</td><td>${p.status}</td><td>${esc(p.utr)}</td><td>${p.proof?'Yes':'No'}</td><td>${p.conf?'Yes':'No'}</td><td>${(p.files||[]).map(f=>`<button onclick="openF('${f.id}')">${f.kind=='proof'?'Proof':'Conf.'}: ${esc(f.name.slice(0,14))}</button>`).join(' ')} <button onclick="att('${p.ref}','proof')">+Proof</button> <button onclick="att('${p.ref}','conf')">+Conf.</button></td><td>${p.status=='Successful'?`<button onclick="rev('${p.ref}')">Reverse</button>`:''}</td></tr>`).join('')}</table></div>`}
function addV(e){e.preventDefault();const nm=$('nv').value.trim();D.vendors.push({id:'v'+Date.now(),name:nm,bill:null,due:'',start:'',end:''});D.log.push({t:new Date().toISOString(),msg:'Vendor added: '+nm});save();render()}
function setBill(e,id){e.preventDefault();const v=D.vendors.find(x=>x.id==id),b=$('bl').value;D.log.push({t:new Date().toISOString(),v:id,old:v.bill,new:b});
 v.bill=b===''?null:Number(b);v.due=$('du').value;v.start=$('ss').value;v.end=$('se').value;save();render()}
async function addP(e){e.preventDefault();const utr=$('pu').value.trim(),amt=Number($('pa').value),date=$('pd').value,vid=$('pv').value;
 const dup=D.pays.find(p=>(utr&&p.utr&&p.utr.toLowerCase()==utr.toLowerCase())||(p.vid==vid&&p.amt==amt&&p.date==date&&p.status!='Cancelled'&&!utr&&!p.utr));
 if(dup&&!confirm('Possible duplicate of '+dup.ref+'. Save anyway?')){$('msg').textContent='Not saved: possible duplicate of '+dup.ref;return}
 const ref='PAY-'+String(D.pays.length+1).padStart(4,'0');
 const fl=[],bad=[];for(const [id,k] of [['pf','proof'],['cf','conf']])for(const f of $(id).files){if(!okF(f)){bad.push(f.name);continue}fl.push({id:ref+'-'+k+'-'+fl.length,kind:k,name:f.name,type:f.type,f})}
 if(bad.length){$('msg').textContent='Not saved. Only PDF, JPG or PNG up to 10 MB: '+bad.join(', ');return}
 try{for(const x of fl)await putF(x.id,x.f)}catch(err){$('msg').textContent='Could not store files in this browser: '+err.message;return}
 D.pays.push({ref,vid,amt,date,type:$('pt').value,method:$('pm').value,status:$('ps').value,utr,notes:$('pn').value,files:fl.map(({f,...m})=>m),proof:$('pp').checked||fl.some(x=>x.kind=='proof'),conf:$('pc').checked||fl.some(x=>x.kind=='conf')});
 D.log.push({t:new Date().toISOString(),msg:'Payment '+ref+' recorded: '+inr(amt)+' ('+$('pt').value+', '+$('ps').value+')'});save();go('Ledger')}
function rev(ref){if(!confirm('Mark '+ref+' as Reversed? History is kept.'))return;const p=D.pays.find(x=>x.ref==ref);D.log.push({t:new Date().toISOString(),ref,old:p.status,new:'Reversed'});p.status='Reversed';save();render()}
function csv(){const r=[['Ref','Date','Vendor','Type','Method','Amount','Status','UTR','Proof','Confirmation','Notes'],...D.pays.map(p=>[p.ref,p.date,D.vendors.find(v=>v.id==p.vid)?.name,p.type,p.method,p.amt,p.status,p.utr,p.proof,p.conf,p.notes])];
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([r.map(x=>x.map(c=>'"'+String(c??'').replace(/"/g,'""')+'"').join(',')).join('\n')],{type:'text/csv'}));a.download='ledger.csv';a.click()}
function charts(c,bills,paid,out){

function countUp(root){if(!root||matchMedia('(prefers-reduced-motion:reduce)').matches)return;

function buildPr(){const pr=$('pr');if(!pr)return;const c=D.vendors.map(calc),fmt=d=>d?d.split('-').reverse().join('-'):'',by=(a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.ref<b.ref?-1:1),vo=id=>D.vendors.find(x=>x.id==id),sg=p=>(p.type==='Refund'||p.type==='Reversal')?-1:1,sc=s=>s==='Successful'?'s-ok':s==='Pending'?'s-w':'s-bad',sub='color:#777;font-size:11px';

 const rows=all.map(p=>{if(p.status==='Successful')run+=sg(p)*p.amt;return`<tr><td>${fmt(p.date)}</td><td><b>${esc(vo(p.vid)?.name)}</b><br><span style="${sub}">${p.ref}${p.utr?' \u00b7 UTR '+esc(p.utr):''}</span></td><td>${p.type}<br><span style="${sub}">${p.method}</span></td><td><span class="ch ${sc(p.status)}">${p.status}</span></td><td style="text-align:right;font-weight:bold;color:${sg(p)<0?'#b3402f':'#222'}">${sg(p)<0?'\u2212':''}${inr(p.amt)}</td><td style="text-align:right;color:#3f7f55">${p.status==='Successful'?inr(run):'\u2014'}</td></tr>`}).join('');

 pr.innerHTML=`<div class="hd"><h1>Dhritimaan &amp; Tushali \u2014 Wedding Expense Statement</h1><div>Generated ${new Date().toLocaleString('en-IN')}</div></div><div class="kp"><div class="kc k1"><span>Confirmed bills</span><b>${inr(tb)}</b></div><div class="kc k2"><span>Total paid</span><b style="color:#3f7f55">${inr(tp)}</b></div><div class="kc k3"><span>Amount still due</span><b style="color:#b3402f">${inr(td)}</b></div><div class="kc k4"><span>Vendors / payments</span><b>${D.vendors.length} / ${D.pays.length}</b></div></div>${tb>0?`<div class="pb"><i style="width:${pct}%"></i></div><div style="${sub}">${Math.round(pct)}% of confirmed bills paid</div>`:''}<div class="lg">How to read: <span style="color:#3f7f55"><b>green</b></span> = paid \u00b7 <span style="color:#b3402f"><b>red</b></span> = still to pay \u00b7 <span style="color:#a98532"><b>gold</b></span> = advance. Amounts are in \u20b9. Only payments marked Successful count towards the totals.</div><h2>All payments by date</h2>${all.length?`<table class="rt"><thead><tr><th>Date</th><th>Vendor</th><th>Type</th><th>Status</th><th style="text-align:right">Amount</th><th style="text-align:right">Paid so far</th></tr></thead><tbody>${rows}</tbody></table>`:`<p style="${sub}">No payments recorded yet.</p>`}<h2>Vendor-wise summary</h2>${cards}`}
